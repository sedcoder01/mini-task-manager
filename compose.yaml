services:
    api:
        build: .
        ports:
            - "8000:8000"
        env_file:
            - .env
        depends_on:
            - db
            
    db:
        image: postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: C4@-----
            POSTGRES_DB: task_manager
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
            
volumes:
    postgres_data: